<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Interactive Render & Secret Vault</title>
  <style>
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0d1017;
      --surface: #141923;
      --surface-elevated: #1b2230;
      --surface-hover: #232c3d;
      --border: #262f40;
      --text: #e5e7eb;
      --text-muted: #9ca3af;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --primary-text: #ffffff;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --info: #0ea5e9;
      --code-bg: #090c12;
      --series-1: #60a5fa;
      --series-2: #2dd4bf;
      --series-3: #a78bfa;
      --series-4: #f472b6;
      --series-5: #a3e635;
      --series-6: #fbbf24;
    }

    [data-theme="light"] {
      color-scheme: light;
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-elevated: #f1f5f9;
      --surface-hover: #e2e8f0;
      --border: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-text: #ffffff;
      --success: #059669;
      --warning: #d97706;
      --danger: #dc2626;
      --info: #0284c7;
      --code-bg: #f1f5f9;
      --series-1: #2563eb;
      --series-2: #0d9488;
      --series-3: #7c3aed;
      --series-4: #db2777;
      --series-5: #65a30d;
      --series-6: #d97706;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      line-height: 1.45;
      overflow: hidden;
    }

    .app-shell {
      display: flex;
      flex-direction: column;
      height: 100%;
      width: 100%;
    }

    /* Top Header & Item Strip */
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 6px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex: none;
    }

    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    .brand-title {
      font-weight: 600;
      font-size: 12px;
      letter-spacing: 0.01em;
      white-space: nowrap;
    }

    .wait-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(245, 158, 11, 0.16);
      color: var(--warning);
      border: 1px solid rgba(245, 158, 11, 0.35);
    }

    .wait-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--warning);
    }

    /* Item Tabs Bar */
    .item-strip {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 5px 10px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      overflow-x: auto;
      flex: none;
    }

    .item-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 9px;
      border-radius: 5px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      font-size: 12px;
      cursor: pointer;
      white-space: nowrap;
      max-width: 200px;
    }

    .item-tab:hover {
      background: var(--surface-hover);
      color: var(--text);
    }

    .item-tab.active {
      background: var(--surface-elevated);
      border-color: var(--border);
      color: var(--text);
      font-weight: 500;
    }

    .item-tab .kind-tag {
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 3px;
      background: var(--bg);
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .item-tab.waiting {
      border-color: rgba(245, 158, 11, 0.45);
      color: var(--text);
    }

    /* Buttons & Inputs */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 28px;
      padding: 0 10px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover:not(:disabled) {
      background: var(--surface-hover);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: default;
    }

    .btn-primary {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
    }

    .btn-danger {
      border-color: rgba(239, 68, 68, 0.4);
      color: var(--danger);
    }

    .btn-sm {
      height: 24px;
      padding: 0 8px;
      font-size: 11px;
    }

    .btn.active {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--primary-text);
    }

    .input, .textarea, .select {
      width: 100%;
      padding: 6px 9px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text);
      font: inherit;
      font-size: 12.5px;
      outline: none;
    }

    .input:focus, .textarea:focus, .select:focus {
      border-color: var(--primary);
    }

    .textarea {
      min-height: 64px;
      resize: vertical;
    }

    /* Main Workspace Content */
    .main-area {
      flex: 1;
      overflow-y: auto;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .empty-state {
      margin: auto;
      max-width: 360px;
      text-align: center;
      color: var(--text-muted);
      padding: 24px;
      border: 1px dashed var(--border);
      border-radius: 8px;
    }

    .empty-state h3 {
      margin: 0 0 6px;
      color: var(--text);
      font-size: 14px;
    }

    /* Item Header Bar */
    .item-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .item-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }

    .item-title {
      font-weight: 600;
      font-size: 13.5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .status-badge {
      font-size: 11px;
      padding: 2px 7px;
      border-radius: 4px;
      font-weight: 500;
      white-space: nowrap;
    }

    .status-waiting { background: rgba(245, 158, 11, 0.16); color: var(--warning); }
    .status-answered { background: rgba(16, 185, 129, 0.16); color: var(--success); }
    .status-shown { background: rgba(14, 165, 233, 0.16); color: var(--info); }
    .status-declined, .status-cancelled, .status-error { background: rgba(239, 68, 68, 0.16); color: var(--danger); }

    /* Secret Card */
    .secret-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .secret-reason {
      color: var(--text-muted);
      white-space: pre-wrap;
      margin: 0;
    }

    .secret-input-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .secret-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 11.5px;
      color: var(--text-muted);
      padding-top: 4px;
      border-top: 1px solid var(--border);
    }

    /* Declarative UI Blocks */
    .ui-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ui-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: stretch;
    }

    .ui-row > * {
      flex: 1 1 160px;
    }

    .ui-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .ui-card-title {
      font-weight: 600;
      font-size: 13px;
      margin: 0;
    }

    .ui-badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 7px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      width: fit-content;
      background: var(--surface-elevated);
      color: var(--text-muted);
    }

    .ui-badge[data-tone="success"] { background: rgba(16, 185, 129, 0.16); color: var(--success); }
    .ui-badge[data-tone="warning"] { background: rgba(245, 158, 11, 0.16); color: var(--warning); }
    .ui-badge[data-tone="error"] { background: rgba(239, 68, 68, 0.16); color: var(--danger); }
    .ui-badge[data-tone="info"] { background: rgba(14, 165, 233, 0.16); color: var(--info); }

    .ui-callout {
      padding: 9px 11px;
      border-radius: 6px;
      border-left: 3px solid var(--info);
      background: var(--surface-elevated);
    }

    .ui-callout[data-tone="warning"] { border-left-color: var(--warning); }
    .ui-callout[data-tone="error"] { border-left-color: var(--danger); }
    .ui-callout[data-tone="success"] { border-left-color: var(--success); }

    .ui-kv {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }

    .ui-kv-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 8px;
      border-bottom: 1px dotted var(--border);
      padding-bottom: 3px;
    }

    .ui-kv-label { color: var(--text-muted); }
    .ui-kv-val { font-weight: 500; font-variant-numeric: tabular-nums; }

    .ui-table-wrap {
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    .ui-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12.5px;
    }

    .ui-table th, .ui-table td {
      padding: 6px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    .ui-table th {
      background: var(--surface-elevated);
      font-weight: 600;
    }

    .ui-table tr:last-child td { border-bottom: none; }

    .ui-stat {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ui-stat-label { color: var(--text-muted); font-size: 11.5px; }
    .ui-stat-val { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }

    .ui-progress {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .ui-progress-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    .ui-progress-track {
      height: 6px;
      border-radius: 999px;
      background: var(--surface-elevated);
      overflow: hidden;
    }

    .ui-progress-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 999px;
    }

    .ui-steps {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .ui-step {
      display: flex;
      gap: 8px;
      align-items: flex-start;
    }

    .ui-step-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      font-weight: 700;
      flex: none;
      margin-top: 1px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
    }

    .ui-step[data-status="done"] .ui-step-dot { background: rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success); }
    .ui-step[data-status="current"] .ui-step-dot { background: rgba(59, 130, 246, 0.2); border-color: var(--primary); color: var(--primary); }
    .ui-step[data-status="blocked"] .ui-step-dot { background: rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger); }

    .ui-choice-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .ui-choice-option {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 5px;
      border: 1px solid var(--border);
      background: var(--bg);
      cursor: pointer;
    }

    .ui-choice-option:hover {
      border-color: var(--primary);
    }

    .ui-chart {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 8px 10px;
      background: var(--surface-elevated);
      border-radius: 6px;
    }

    .ui-bar-row {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .ui-bar-header {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
    }

    /* HTML Render Frame */
    .iframe-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      overflow: hidden;
    }

    .render-iframe {
      width: 100%;
      border: 0;
      display: block;
      min-height: 80px;
      background: transparent;
    }

    /* Waiting Action & Escape Hatch Footer */
    .waiting-footer {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .waiting-footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Annotation Drawer */
    .annotation-box {
      background: var(--surface);
      border: 1px solid var(--primary);
      border-radius: 7px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .annotation-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
      padding: 6px 8px;
      background: var(--surface-elevated);
      border-radius: 5px;
      border: 1px solid var(--border);
    }

    .annotation-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 11px;
      color: var(--primary);
    }

    .settled-banner {
      padding: 8px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .toast {
      position: fixed;
      bottom: 12px;
      right: 12px;
      padding: 8px 12px;
      border-radius: 6px;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px;
      z-index: 1000;
      display: none;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <span class="brand-title">Interactive Render</span>
        <span id="waitingBadge" class="wait-pill" style="display:none">
          <span class="wait-dot"></span>
          <span id="waitingCountText">1 Waiting</span>
        </span>
      </div>
      <div class="topbar-right">
        <button id="annotateBtn" class="btn btn-sm" style="display:none" title="Click elements inside the HTML page to annotate">Annotate</button>
        <button id="copyEmbedBtn" class="btn btn-sm" style="display:none" title="Copy <agent-embed> tag for chat">Copy Embed</button>
        <button id="downloadBtn" class="btn btn-sm" style="display:none" title="Download standalone HTML">Download</button>
        <button id="themeBtn" class="btn btn-sm" title="Switch Dark / Light theme">Theme</button>
        <button id="clearBtn" class="btn btn-sm" title="Clear settled history">Clear</button>
      </div>
    </header>

    <nav id="itemStrip" class="item-strip" style="display:none"></nav>

    <main id="mainArea" class="main-area"></main>
  </div>
  <div id="toast" class="toast"></div>
  <script src="/app.js"></script>
</body>
</html>
